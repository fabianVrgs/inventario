<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Elegir material — Ok-producciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- BARRA SUPERIOR: la misma en esta pantalla y en Inventario -->
  <header class="barra-app">
    <div class="barra-app__interior">
      <a class="barra-app__marca" href="/">
        <img src="/img/logo.jpg" alt="" class="barra-app__logo">
        <span class="barra-app__nombre">Ok-producciones<br>Almacén</span>
      </a>
      <nav class="barra-app__nav" aria-label="Principal">
        <a class="barra-app__enlace" href="/" aria-current="page">Elegir</a>
        <a class="barra-app__enlace" href="/html/inventario.html">Inventario</a>
        <a class="barra-app__enlace" href="/html/orden_del_dia.html">Orden del día</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <div class="cabecera-pantalla">
      <h1>Elegir material</h1>
      <p class="cabecera-pantalla__sub">Ajusta la cantidad de lo que sale hoy.</p>
    </div>

    <!-- Dos columnas a partir de 1024px: catálogo a la izquierda, selección
         fija a la derecha. Por debajo se apila. -->
    <div class="disposicion">

      <div class="disposicion__principal">
        <div class="buscador">
          <label class="visualmente-oculto" for="buscar">Buscar producto</label>
          <input type="search" id="buscar" class="campo" placeholder="Buscar producto…" autocomplete="off">
        </div>

        <!-- logica.js monta aquí .grupo-area > .rejilla-productos > .producto -->
        <div id="resultados" class="resultados"></div>
      </div>

      <aside class="disposicion__lateral" aria-label="Selección">
        <section class="panel-seleccion">
          <div class="panel-seleccion__cabecera">
            <h2>Selección</h2>
            <p class="panel-seleccion__resumen cifra" data-resumen></p>
          </div>
          <p id="listaVacia" class="lista__vacia">Todavía no has elegido nada.</p>
          <ul id="lista" class="lista__items"></ul>
          <a id="ctaOrden" href="/html/orden_del_dia.html"
             class="btn btn--primario panel-seleccion__cta" hidden>Ver orden del día</a>
        </section>
      </aside>

    </div>

  </main>

  <!-- BARRA DE SELECCIÓN: atajo persistente mientras se recorre el catálogo.
       Solo hasta 1024px — por encima, el panel lateral ya está siempre a la
       vista y repetir el contador sería ruido. Se oculta con el atributo
       `hidden`, que funciona gracias a [hidden]{display:none!important}. -->
  <div id="barraSeleccion" class="barra-seleccion" hidden>
    <div class="barra-seleccion__interior">
      <p class="barra-seleccion__resumen cifra" data-resumen></p>
      <a href="/html/orden_del_dia.html" class="btn btn--primario">Ver orden del día</a>
    </div>
  </div>

  <script src="/js/logica.js"></script>
</body>
</html>
